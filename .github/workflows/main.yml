name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "SmartVpnSwitch-Android14.zip"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v5

      - name: Установить Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Проверить архив
        run: |
          ls -lh
          file SmartVpnSwitch-Android14.zip
          unzip -t SmartVpnSwitch-Android14.zip

      - name: Распаковать проект
        run: |
          rm -rf source
          unzip -q SmartVpnSwitch-Android14.zip -d source

          WRAPPER="$(find source -type f -name gradlew -print -quit)"

          if [ -z "$WRAPPER" ]; then
            echo "Файл gradlew не найден. Содержимое source:"
            find source -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Установить Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager не найден"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Собрать APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartVpnSwitch-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
