name: Build SmartVpnSwitch APK

on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o SmartVpnSwitch-Android14.zip -d project

      - name: Build APK
        run: |
          cd project/SmartVpnSwitch
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartVpnSwitch-APK
          path: project/SmartVpnSwitch/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
