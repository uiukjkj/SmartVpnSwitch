name: Inspect SmartVpnSwitch

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q SmartVpnSwitch-Android14.zip -d project

      - name: Read project files
        run: |
          cd project/SmartVpnSwitch

          echo "===== README ====="
          cat README.md

          echo "===== ROOT GRADLE ====="
          cat build.gradle.kts

          echo "===== APP GRADLE ====="
          cat app/build.gradle.kts

          echo "===== SETTINGS ====="
          cat settings.gradle.kts

          echo "===== MANIFEST ====="
          cat app/src/main/AndroidManifest.xml

          echo "===== ALL FILES ====="
          find . -type f
