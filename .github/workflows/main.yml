name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "SmartVpnSwitch-Android14.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Установить Android SDK
        uses: android-actions/setup-android@v3

      - name: Распаковать архив и найти проект
        run: |
          unzip -q SmartVpnSwitch-Android14.zip -d extracted
          WRAPPER="$(find extracted -type f -name gradlew -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "В архиве не найден gradlew — возможно, в ZIP нет Gradle-проекта."
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Собрать APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Сохранить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: SmartVpnSwitch-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
