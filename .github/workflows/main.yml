name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "SmartVpnSwitch-Android14.zip"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v5

      - name: Установить Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Распаковать проект
        run: |
          rm -rf source
          unzip -q SmartVpnSwitch-Android14.zip -d source

          SETTINGS="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "Не найден settings.gradle или settings.gradle.kts"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Исправить конфликт Android Manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          manifest = Path(os.environ["PROJECT_DIR"]) / "app/src/main/AndroidManifest.xml"
          text = manifest.read_text(encoding="utf-8")

          text = text.replace(
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android"\n'
              '    xmlns:tools="http://schemas.android.com/tools">'
          )

          needle = 'android:name="com.wireguard.android.backend.GoBackend$VpnService"\n'
          if needle in text:
              text = text.replace(
                  needle,
                  needle + '            tools:replace="android:exported"\n',
                  1
              )
          else:
              raise RuntimeError("Сервис WireGuard VpnService не найден")

          manifest.write_text(text, encoding="utf-8")
          print(f"Исправлен: {manifest}")
          PY

      - name: Установить Gradle 8.7
        run: |
          curl -L --fail \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Установить Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Собрать debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartVpnSwitch-debug-apk
          path: "source/**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
