name: Extract and Inspect SmartVpnSwitch

on:
workflow_dispatch:

jobs:
extract:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Check ZIP archive
    run: |
      if [ ! -f "SmartVpnSwitch-Android14.zip" ]; then
        echo "ERROR: Archive not found!"
        ls -lah
        exit 1
      fi

      unzip -t "SmartVpnSwitch-Android14.zip"

  - name: Extract archive
    run: |
      mkdir -p extracted
      unzip -o "SmartVpnSwitch-Android14.zip" -d extracted

  - name: Show all project files
    run: |
      echo "===== ALL FILES ====="
      find extracted -type f | sort

      echo "===== SOURCE CODE ====="
      find extracted -type f \
        -name "*.kt" -o \
        -name "*.java" \
      | sort

      echo "===== RESOURCES ====="
      find extracted -type d -name "res" -print

      echo "===== GRADLE FILES ====="
      find extracted -type f \
        -name "*.gradle" -o \
        -name "*.gradle.kts" -o \
        -name "gradlew" \
      -print

  - name: Upload extracted project
    uses: actions/upload-artifact@v4
    with:
      name: SmartVpnSwitch-extracted
      path: extracted/
      if-no-files-found: error
      retention-days: 3
