name: Inspect Android Project

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract archive
        run: |
          mkdir project
          unzip -q SmartVpnSwitch-Android14.zip -d project

      - name: Inspect files
        run: |
          echo "===== FILES ====="
          find project -maxdepth 5 -type f | head -300
          echo "===== DIRECTORIES ====="
          find project -maxdepth 4 -type d
